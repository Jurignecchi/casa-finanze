<script>
        let inventory = [], shoppingList = [], maintenance = [], tasks = [], transactions = [], fixedExpenses = [], investmentHistory = [];
        let compareChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            ['tx-date', 'task-date', 'maint-date'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = today;
            });
            fetchAllData();
            lucide.createIcons();
        });

        async function fetchAllData() {
            try {
                const [invRes, shopRes, maintRes, taskRes, txRes, fixRes, invHistRes] = await Promise.all([
                    fetch('/api/inventory').then(r => r.json()),
                    fetch('/api/shopping').then(r => r.json()),
                    fetch('/api/maintenance').then(r => r.json()),
                    fetch('/api/tasks').then(r => r.json()),
                    fetch('/api/transactions').then(r => r.json()),
                    fetch('/api/fixed_expenses').then(r => r.json()),
                    fetch('/api/investments').then(r => r.json())
                ]);
                inventory = invRes; shoppingList = shopRes; maintenance = maintRes;
                tasks = taskRes; transactions = txRes; fixedExpenses = fixRes; investmentHistory = invHistRes;
                renderAll();
            } catch (err) { console.error("Errore:", err); }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showView(viewName) {
            ['view-hub', 'view-casa', 'view-finanze'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            if (viewName === 'finanze') renderCompareChart();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAll() {
            renderInventory(); renderShoppingList(); renderMaintenance();
            renderTasks(); renderTransactions(); renderFixedExpenses();
            renderFinanceStats();
        }

        async function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            const query = document.getElementById('inventory-search')?.value.toLowerCase().trim() || '';
            inventory.filter(i => i.name.toLowerCase().includes(query)).forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border';
                el.innerHTML = `
                    <div><p class="text-sm font-semibold">${item.name}</p><span class="text-[10px] text-slate-400">${item.category || ''}</span></div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded">-</button>
                        <span class="w-6 text-center text-xs font-bold">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-indigo-600 text-white rounded">+</button>
                        <button onclick="deleteItem('inventory', ${item.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            document.getElementById('inventory-count-text').innerText = `${inventory.length} articoli totali`;
            lucide.createIcons();
        }

        async function changeQty(id, delta) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(0, item.qty + delta);
                await fetch(`/api/inventory/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
                renderInventory();
            }
        }

        async function handleInventorySubmit(e) {
            e.preventDefault();
            const newItem = { name: document.getElementById('inv-name').value, qty: parseInt(document.getElementById('inv-qty').value) || 1, category: document.getElementById('inv-cat').value, autoRestock: true };
            await fetch('/api/inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newItem) });
            closeModal('inventory-modal'); fetchAllData();
        }

        async function deleteItem(table, id) {
            await fetch(`/api/${table}/${id}`, { method: 'DELETE' });
            fetchAllData();
        }

        async function renderShoppingList() {
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            shoppingList.forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border';
                el.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button onclick="purchaseItem(${item.id})" class="w-5 h-5 border-2 border-emerald-500 rounded flex items-center justify-center text-emerald-600 hover:bg-emerald-500 hover:text-white"><i data-lucide="check" class="w-3 h-3"></i></button>
                        <span class="text-sm font-medium">${item.name} (${item.qty})</span>
                    </div>
                    <button onclick="deleteItem('shopping', ${item.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function handleShoppingSubmit(e) {
            e.preventDefault();
            const newItem = { name: document.getElementById('shop-name').value, qty: parseInt(document.getElementById('shop-qty').value) || 1 };
            await fetch('/api/shopping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newItem) });
            closeModal('shopping-modal'); fetchAllData();
        }

        async function purchaseItem(id) {
            const item = shoppingList.find(s => s.id === id);
            if (item) {
                await fetch('/api/inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: item.name, qty: item.qty, category: 'Acquistato', autoRestock: false }) });
                await deleteItem('shopping', id);
            }
        }

        async function renderMaintenance() {
            const list = document.getElementById('maintenance-list');
            list.innerHTML = '';
            maintenance.forEach(m => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `<div><p class="font-semibold">${m.title}</p><span class="text-slate-400">Scadenza: ${m.date}</span></div>
                    <button onclick="deleteItem('maintenance', ${m.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function handleMaintenanceSubmit(e) {
            e.preventDefault();
            const data = { title: document.getElementById('maint-title').value, date: document.getElementById('maint-date').value, status: document.getElementById('maint-status').value };
            await fetch('/api/maintenance', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            closeModal('maintenance-modal'); fetchAllData();
        }

        async function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            tasks.forEach(t => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `<div class="flex items-center space-x-2"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})"><span class="${t.done ? 'line-through text-slate-400' : ''}">${t.title}</span></div>
                    <button onclick="deleteItem('tasks', ${t.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function toggleTask(id) {
            const t = tasks.find(item => item.id === id);
            if(t) {
                t.done = !t.done;
                await fetch(`/api/tasks/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) });
                renderTasks();
            }
        }

        async function handleTaskSubmit(e) {
            e.preventDefault();
            const data = { title: document.getElementById('task-title').value, date: document.getElementById('task-date').value, recurrence: document.getElementById('task-recurrence').value, done: false };
            await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            closeModal('task-modal'); fetchAllData();
        }

        async function handleTransactionSubmit(e) {
            e.preventDefault();
            const tx = {
                type: document.getElementById('tx-type').value,
                amount: parseFloat(document.getElementById('tx-amount').value),
                description: document.getElementById('tx-desc').value,
                date: document.getElementById('tx-date').value
            };
            await fetch('/api/transactions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tx) });
            e.target.reset();
            fetchAllData();
        }

        async function handleFixedExpenseSubmit(e) {
            e.preventDefault();
            const fix = {
                description: document.getElementById('fix-desc').value,
                amount: parseFloat(document.getElementById('fix-amount').value),
                duration: document.getElementById('fix-duration').value
            };
            await fetch('/api/fixed_expenses', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fix) });
            e.target.reset();
            fetchAllData();
        }

        function renderTransactions() {
            const list = document.getElementById('transactions-list');
            if(!list) return;
            list.innerHTML = '';
            transactions.forEach(tx => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border text-xs';
                const isIncome = tx.type === 'income';
                el.innerHTML = `
                    <div><p class="font-semibold">${tx.description}</p><span class="text-slate-400">${tx.date}</span></div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">${isIncome ? '+' : '-'} € ${tx.amount.toFixed(2)}</span>
                        <button onclick="deleteItem('transactions', ${tx.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderFixedExpenses() {
            const list = document.getElementById('fixed-expenses-list');
            if(!list) return;
            list.innerHTML = '';
            fixedExpenses.forEach(fix => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `
                    <div><p class="font-semibold">${fix.description}</p><span class="text-slate-400">Durata: ${fix.duration}</span></div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-700">€ ${fix.amount.toFixed(2)}</span>
                        <button onclick="deleteItem('fixed_expenses', ${fix.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderFinanceStats() {
            let totalIncomes = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            let totalExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            let totalBalance = totalIncomes - totalExpenses;

            if(document.getElementById('stat-total-balance')) document.getElementById('stat-total-balance').innerText = `€ ${totalBalance.toFixed(2)}`;
            if(document.getElementById('stat-total-incomes')) document.getElementById('stat-total-incomes').innerText = `+ € ${totalIncomes.toFixed(2)}`;
            if(document.getElementById('stat-total-expenses')) document.getElementById('stat-total-expenses').innerText = `- € ${totalExpenses.toFixed(2)}`;
        }

        function renderCompareChart() {
            renderFinanceStats();
            let totalIncomes = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            let totalExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

            const ctx = document.getElementById('compareChart');
            if(!ctx) return;

            if(compareChartInstance) {
                compareChartInstance.destroy();
            }

            compareChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Entrate', 'Uscite'],
                    datasets: [{
                        data: [totalIncomes, totalExpenses],
                        backgroundColor: ['#10b981', '#f43f5e']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
    </script>
