<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Completa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Navbar / Header -->
    <header class="bg-white border-b sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-indigo-600">Dashboard</h1>
        <nav class="flex space-x-2">
            <button onclick="showView('hub')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition">Hub</button>
            <button onclick="showView('casa')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-slate-100 transition">Casa</button>
            <button onclick="showView('finanze')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-50 text-slate-600 hover:bg-slate-100 transition">Finanze</button>
        </nav>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- VIEW: HUB -->
        <div id="view-hub" class="space-y-6">
            <!-- Inventario -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <div>
                        <h2 class="text-sm font-bold">Inventario</h2>
                        <span id="inventory-count-text" class="text-[10px] text-slate-400">0 articoli totali</span>
                    </div>
                    <button onclick="openModal('inventory-modal')" class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">+</button>
                </div>
                <div class="mb-3">
                    <input type="text" id="inventory-search" placeholder="Cerca nell'inventario..." oninput="renderInventory()" class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div id="inventory-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </section>

            <!-- Lista della Spesa -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold">Lista Spesa</h2>
                    <button onclick="openModal('shopping-modal')" class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">+</button>
                </div>
                <div id="shopping-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </section>
        </div>

        <!-- VIEW: CASA -->
        <div id="view-casa" class="hidden space-y-6">
            <!-- Manutenzione -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold">Manutenzione</h2>
                    <button onclick="openModal('maintenance-modal')" class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">+</button>
                </div>
                <div id="maintenance-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </section>

            <!-- Task -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold">Attività & Task</h2>
                    <button onclick="openModal('task-modal')" class="w-8 h-8 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">+</button>
                </div>
                <div id="tasks-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </section>
        </div>

        <!-- VIEW: FINANZE -->
        <div id="view-finanze" class="hidden space-y-6">
            <!-- Statistiche Generali -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <span class="text-[10px] text-slate-400 block">Bilancio</span>
                    <span id="stat-total-balance" class="text-xs font-bold text-slate-800">€ 0.00</span>
                </div>
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <span class="text-[10px] text-slate-400 block">Entrate</span>
                    <span id="stat-total-incomes" class="text-xs font-bold text-emerald-600">+ € 0.00</span>
                </div>
                <div class="bg-white p-3 rounded-xl border shadow-sm">
                    <span class="text-[10px] text-slate-400 block">Uscite</span>
                    <span id="stat-total-expenses" class="text-xs font-bold text-rose-600">- € 0.00</span>
                </div>
            </div>

            <!-- Grafico -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold mb-3">Riepilogo Finanziario</h2>
                <div class="h-48 relative flex justify-center items-center">
                    <canvas id="compareChart"></canvas>
                </div>
            </section>

            <!-- Form Transazione -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold mb-3">Nuova Transazione</h2>
                <form onsubmit="handleTransactionSubmit(event)" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="tx-type" class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                            <option value="expense">Uscita</option>
                            <option value="income">Entrata</option>
                        </select>
                        <input type="number" step="0.01" id="tx-amount" placeholder="Importo (€)" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                    </div>
                    <input type="text" id="tx-desc" placeholder="Descrizione" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                    <input type="date" id="tx-date" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                    <button type="submit" class="w-full py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 transition">Aggiungi Transazione</button>
                </form>
                <div id="transactions-list" class="space-y-2 mt-4 max-h-40 overflow-y-auto"></div>
            </section>

            <!-- Spese Fisse -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold mb-3">Spese Fisse / Abbonamenti</h2>
                <form onsubmit="handleFixedExpenseSubmit(event)" class="space-y-3">
                    <input type="text" id="fix-desc" placeholder="Nome Spesa (es. Netflix)" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="0.01" id="fix-amount" placeholder="Importo (€)" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                        <input type="text" id="fix-duration" placeholder="Frequenza (es. Mensile)" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                    </div>
                    <button type="submit" class="w-full py-2 bg-slate-800 text-white text-xs font-semibold rounded-xl hover:bg-slate-900 transition">Aggiungi Spesa Fissa</button>
                </form>
                <div id="fixed-expenses-list" class="space-y-2 mt-4 max-h-40 overflow-y-auto"></div>
            </section>
        </div>

    </main>

    <!-- MODALI -->
    <!-- Modale Inventario -->
    <div id="inventory-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-sm font-bold">Aggiungi Articolo Inventario</h3>
            <form onsubmit="handleInventorySubmit(event)" class="space-y-3">
                <input type="text" id="inv-name" placeholder="Nome articolo" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="number" id="inv-qty" placeholder="Quantità" value="1" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="text" id="inv-cat" placeholder="Categoria" class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal('inventory-modal')" class="w-1/2 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl">Annulla</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Spesa -->
    <div id="shopping-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-sm font-bold">Aggiungi alla Spesa</h3>
            <form onsubmit="handleShoppingSubmit(event)" class="space-y-3">
                <input type="text" id="shop-name" placeholder="Cosa comprare?" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="number" id="shop-qty" placeholder="Quantità" value="1" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal('shopping-modal')" class="w-1/2 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl">Annulla</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Manutenzione -->
    <div id="maintenance-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-sm font-bold">Aggiungi Manutenzione</h3>
            <form onsubmit="handleMaintenanceSubmit(event)" class="space-y-3">
                <input type="text" id="maint-title" placeholder="Titolo attività" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="date" id="maint-date" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="text" id="maint-status" placeholder="Stato (es. Da fare)" class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal('maintenance-modal')" class="w-1/2 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl">Annulla</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Task -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-sm font-bold">Aggiungi Task</h3>
            <form onsubmit="handleTaskSubmit(event)" class="space-y-3">
                <input type="text" id="task-title" placeholder="Titolo task" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="date" id="task-date" required class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <input type="text" id="task-recurrence" placeholder="Ricorrenza (opzionale)" class="w-full px-3 py-2 text-xs border rounded-xl bg-slate-50">
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeModal('task-modal')" class="w-1/2 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl">Annulla</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGICA E API -->
    <script>
        let inventory = [], shoppingList = [], maintenance = [], tasks = [], transactions = [], fixedExpenses = [], investmentHistory = [];
        let compareChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            ['tx-date', 'task-date', 'maint-date'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = today;
            });
            fetchAllData();
            lucide.createIcons();
        });

        async function fetchAllData() {
            try {
                const [invRes, shopRes, maintRes, taskRes, txRes, fixRes, invHistRes] = await Promise.all([
                    fetch('/api/inventory').then(r => r.json()),
                    fetch('/api/shopping').then(r => r.json()),
                    fetch('/api/maintenance').then(r => r.json()),
                    fetch('/api/tasks').then(r => r.json()),
                    fetch('/api/transactions').then(r => r.json()),
                    fetch('/api/fixed_expenses').then(r => r.json()),
                    fetch('/api/investments').then(r => r.json())
                ]);
                inventory = invRes; shoppingList = shopRes; maintenance = maintRes;
                tasks = taskRes; transactions = txRes; fixedExpenses = fixRes; investmentHistory = invHistRes;
                renderAll();
            } catch (err) { console.error("Errore:", err); }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showView(viewName) {
            ['view-hub', 'view-casa', 'view-finanze'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            if (viewName === 'finanze') renderCompareChart();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAll() {
            renderInventory(); renderShoppingList(); renderMaintenance();
            renderTasks(); renderTransactions(); renderFixedExpenses();
            renderFinanceStats();
        }

        async function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            const query = document.getElementById('inventory-search')?.value.toLowerCase().trim() || '';
            inventory.filter(i => i.name.toLowerCase().includes(query)).forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border';
                el.innerHTML = `
                    <div><p class="text-sm font-semibold">${item.name}</p><span class="text-[10px] text-slate-400">${item.category || ''}</span></div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded">-</button>
                        <span class="w-6 text-center text-xs font-bold">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-indigo-600 text-white rounded">+</button>
                        <button onclick="deleteItem('inventory', ${item.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            document.getElementById('inventory-count-text').innerText = `${inventory.length} articoli totali`;
            lucide.createIcons();
        }

        async function changeQty(id, delta) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(0, item.qty + delta);
                await fetch(`/api/inventory/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
                renderInventory();
            }
        }

        async function handleInventorySubmit(e) {
            e.preventDefault();
            const newItem = { name: document.getElementById('inv-name').value, qty: parseInt(document.getElementById('inv-qty').value) || 1, category: document.getElementById('inv-cat').value, autoRestock: true };
            await fetch('/api/inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newItem) });
            closeModal('inventory-modal'); fetchAllData();
        }

        async function deleteItem(table, id) {
            await fetch(`/api/${table}/${id}`, { method: 'DELETE' });
            fetchAllData();
        }

        async function renderShoppingList() {
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            shoppingList.forEach(item => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border';
                el.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button onclick="purchaseItem(${item.id})" class="w-5 h-5 border-2 border-emerald-500 rounded flex items-center justify-center text-emerald-600 hover:bg-emerald-500 hover:text-white"><i data-lucide="check" class="w-3 h-3"></i></button>
                        <span class="text-sm font-medium">${item.name} (${item.qty})</span>
                    </div>
                    <button onclick="deleteItem('shopping', ${item.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function handleShoppingSubmit(e) {
            e.preventDefault();
            const newItem = { name: document.getElementById('shop-name').value, qty: parseInt(document.getElementById('shop-qty').value) || 1 };
            await fetch('/api/shopping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newItem) });
            closeModal('shopping-modal'); fetchAllData();
        }

        async function purchaseItem(id) {
            const item = shoppingList.find(s => s.id === id);
            if (item) {
                await fetch('/api/inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: item.name, qty: item.qty, category: 'Acquistato', autoRestock: false }) });
                await deleteItem('shopping', id);
            }
        }

        async function renderMaintenance() {
            const list = document.getElementById('maintenance-list');
            list.innerHTML = '';
            maintenance.forEach(m => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `<div><p class="font-semibold">${m.title}</p><span class="text-slate-400">Scadenza: ${m.date}</span></div>
                    <button onclick="deleteItem('maintenance', ${m.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function handleMaintenanceSubmit(e) {
            e.preventDefault();
            const data = { title: document.getElementById('maint-title').value, date: document.getElementById('maint-date').value, status: document.getElementById('maint-status').value };
            await fetch('/api/maintenance', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            closeModal('maintenance-modal'); fetchAllData();
        }

        async function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            tasks.forEach(t => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `<div class="flex items-center space-x-2"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})"><span class="${t.done ? 'line-through text-slate-400' : ''}">${t.title}</span></div>
                    <button onclick="deleteItem('tasks', ${t.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        async function toggleTask(id) {
            const t = tasks.find(item => item.id === id);
            if(t) {
                t.done = !t.done;
                await fetch(`/api/tasks/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) });
                renderTasks();
            }
        }

        async function handleTaskSubmit(e) {
            e.preventDefault();
            const data = { title: document.getElementById('task-title').value, date: document.getElementById('task-date').value, recurrence: document.getElementById('task-recurrence').value, done: false };
            await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            closeModal('task-modal'); fetchAllData();
        }

        async function handleTransactionSubmit(e) {
            e.preventDefault();
            const tx = {
                type: document.getElementById('tx-type').value,
                amount: parseFloat(document.getElementById('tx-amount').value),
                description: document.getElementById('tx-desc').value,
                date: document.getElementById('tx-date').value
            };
            await fetch('/api/transactions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tx) });
            e.target.reset();
            fetchAllData();
        }

        async function handleFixedExpenseSubmit(e) {
            e.preventDefault();
            const fix = {
                description: document.getElementById('fix-desc').value,
                amount: parseFloat(document.getElementById('fix-amount').value),
                duration: document.getElementById('fix-duration').value
            };
            await fetch('/api/fixed_expenses', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fix) });
            e.target.reset();
            fetchAllData();
        }

        function renderTransactions() {
            const list = document.getElementById('transactions-list');
            if(!list) return;
            list.innerHTML = '';
            transactions.forEach(tx => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border text-xs';
                const isIncome = tx.type === 'income';
                el.innerHTML = `
                    <div><p class="font-semibold">${tx.description}</p><span class="text-slate-400">${tx.date}</span></div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">${isIncome ? '+' : '-'} € ${tx.amount.toFixed(2)}</span>
                        <button onclick="deleteItem('transactions', ${tx.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderFixedExpenses() {
            const list = document.getElementById('fixed-expenses-list');
            if(!list) return;
            list.innerHTML = '';
            fixedExpenses.forEach(fix => {
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border text-xs';
                el.innerHTML = `
                    <div><p class="font-semibold">${fix.description}</p><span class="text-slate-400">Durata: ${fix.duration}</span></div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-700">€ ${fix.amount.toFixed(2)}</span>
                        <button onclick="deleteItem('fixed_expenses', ${fix.id})" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                list.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderFinanceStats() {
            let totalIncomes = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            let totalExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            let totalBalance = totalIncomes - totalExpenses;

            if(document.getElementById('stat-total-balance')) document.getElementById('stat-total-balance').innerText = `€ ${totalBalance.toFixed(2)}`;
            if(document.getElementById('stat-total-incomes')) document.getElementById('stat-total-incomes').innerText = `+ € ${totalIncomes.toFixed(2)}`;
            if(document.getElementById('stat-total-expenses')) document.getElementById('stat-total-expenses').innerText = `- € ${totalExpenses.toFixed(2)}`;
        }

        function renderCompareChart() {
            renderFinanceStats();
            let totalIncomes = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            let totalExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

            const ctx = document.getElementById('compareChart');
            if(!ctx) return;

            if(compareChartInstance) {
                compareChartInstance.destroy();
            }

            compareChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Entrate', 'Uscite'],
                    datasets: [{
                        data: [totalIncomes, totalExpenses],
                        backgroundColor: ['#10b981', '#f43f5e']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
    </script>
</body>
</html>
